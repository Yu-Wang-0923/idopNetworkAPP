# 本地开发便利文件
# 实际的两个包分别在:
#   packages/idopnetwork/         (核心算法库)
#   packages/idopnetwork-app/     (Streamlit 应用)
#
# 开发安装:
#   pip install -e packages/idopnetwork
#   pip install -e packages/idopnetwork-app

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idopnetwork-monorepo"
version = "0.1.0"
description = "idopNetwork monorepo — packages/idopnetwork + packages/idopnetwork-app"
requires-python = ">=3.10"
